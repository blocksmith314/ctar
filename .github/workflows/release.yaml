name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # required to create a release

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build inside an AlmaLinux 8 container, which gives a glibc 2.28
  # baseline.
  #
  # glibc only works "build old, run new", so the baseline is set by the build
  # container. AlmaLinux 8 was chosen because 2.28 is the lowest baseline still
  # served by a maintained RHEL-family release with a GCC 14 toolset, and it
  # covers strictly more systems than building against 2.34 or 2.35:
  #   RHEL 8 family (2.28), Ubuntu 20.04 (2.31), Debian 11 (2.31),
  #   RHEL 9 family (2.34), Ubuntu 22.04 (2.35), Debian 12 (2.36)
  #
  # Note the ordering surprise that motivated this: RHEL 9 ships glibc 2.34,
  # which is LOWER than Ubuntu 22.04's 2.35 even though RHEL 9 is newer, so a
  # binary built on Ubuntu 22.04 cannot run on RHEL 9.
  #
  # Why not simply use the ubuntu-22.04 runner: GitHub has announced that image
  # starts deprecation on 2026-09-17 and is removed by 2027-04; the container
  # approach is not affected by that schedule.
  # ---------------------------------------------------------------------------
  build-linux:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    container: almalinux:8
    steps:
      - uses: actions/checkout@v4

      # AlmaLinux 8 does not ship GCC 14 as its default toolchain; gcc-toolset-14
      # provides it and installs under /opt/rh, which is NOT on PATH by default.
      # cmake 3.26 (>= 3.20, enough for CMAKE_CXX_STANDARD 23) is in AppStream.
      # ninja-build is not reliably available in the enabled repositories, so the
      # default Makefiles generator is used instead; make is in BaseOS.
      - name: Install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar gzip binutils cmake make gcc-toolset-14
          echo "--- container glibc ---"
          ldd --version | head -1
          echo "--- toolchain ---"
          /opt/rh/gcc-toolset-14/root/usr/bin/g++ --version | head -1
          cmake --version | head -1
          make --version | head -1
          # The gcc-toolset binaries are not on PATH and need their own runtime
          # libraries, so both are exported for the remaining steps.
          echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/rh/gcc-toolset-14/root/usr/lib64:/opt/rh/gcc-toolset-14/root/usr/lib" >> "$GITHUB_ENV"

      - name: Show compiler on PATH
        run: g++ --version | head -1

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-almalinux8-${{ hashFiles('CMakeLists.txt') }}

      # CMAKE_INSTALL_PREFIX is baked into ctar.pc at configure time, so it is
      # fixed at /usr/local to keep the .pc file consistent with where the
      # package is installed.
      # -static-libstdc++ is required, not optional: gcc-toolset-14's libstdc++
      # is newer than the one shipped by AlmaLinux 8, so without static linking
      # the binary fails with GLIBCXX_3.4.3x not found.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/gcc
          -DCMAKE_CXX_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr/local
          -DBUILD_CLI=ON
          -DBUILD_TEST=OFF
          -DBUILD_BENCHMARKS=OFF
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Install into staging tree
        run: cmake --install build --prefix "$PWD/stage"

      # Enforce the compatibility promise: if a future change raises the glibc
      # baseline above 2.28, fail the build instead of shipping a binary that
      # cannot run on RHEL 8.
      # The full version list is printed unconditionally so that an unexpected
      # requirement can be traced to the exact symbols.
      - name: Check glibc baseline
        run: |
          echo "--- container glibc ---"
          ldd --version | head -1

          echo "--- glibc versions referenced by the binary ---"
          objdump -T stage/bin/ctar | grep -o 'GLIBC_[0-9.]*' | sort -uV

          BASE=$(objdump -T stage/bin/ctar | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "minimum glibc required: ${BASE:-none (statically linked)}"
          if [ -n "$BASE" ]; then
            HIGHEST=$(printf '%s\n' GLIBC_2.28 "$BASE" | sort -V | tail -1)
            if [ "$HIGHEST" != "GLIBC_2.28" ]; then
              echo "--- symbols requiring a version above the baseline ---"
              objdump -T stage/bin/ctar | grep -E 'GLIBC_2\.(2[9]|3[0-9])' | head -25
              echo "--- which stage does that symbol come from? ---"
              file stage/bin/ctar
              echo "::error::binary requires $BASE, above GLIBC_2.28 of RHEL 8; it will not run there"
              exit 1
            fi
            echo "OK: not above GLIBC_2.28, runs on RHEL 8+, Ubuntu 20.04+ and Debian 11+"
          fi

      - name: Show runtime dependencies
        run: ldd stage/bin/ctar

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          BASE="ctar-${VERSION}-linux-x86_64"

          strip stage/bin/ctar || true
          mkdir -p dist
          cp stage/bin/ctar "dist/${BASE}"
          chmod +x "dist/${BASE}"
          tar -C stage -czf "dist/${BASE}.tar.gz" .

          ls -lh dist

      - name: Smoke test the shipped binary
        run: |
          dist/ctar-*-linux-x86_64 --help > /dev/null
          echo "standalone binary runs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: system clang with CMAKE_OSX_DEPLOYMENT_TARGET=13.3.
  #
  # 13.3 is a hard floor for Apple's libc++: its floating-point std::to_chars is
  # an OS-exported, availability-annotated symbol
  # (_LIBCPP_AVAILABILITY_TO_CHARS_FLOATING_POINT, "introduced in macOS 13.3"),
  # and std::format/std::print instantiate the floating-point formatter
  # regardless of the argument types -- even
  #   std::format("{}:{}", std::string, int)
  # fails to compile below 13.3. That was verified with a minimal program:
  # -mmacosx-version-min=11.0 and 12.0 both fail, 13.3 and 14.0 both build.
  #
  # Using Homebrew GCC instead would avoid that symbol, but it is not viable:
  # its static libstdc++.a has object files built for newer macOS. Linking it
  # with -mmacosx-version-min=11.0 "succeeds" but emits 102 warnings of the form
  #   object file (...libstdc++.a[100](locale_facets.o)) was built for newer
  #   'macOS' version (26.0) than being linked (11.0)
  # so the binary would claim 11.0 while embedding objects built for 26.0.
  #
  # If CMAKE_OSX_DEPLOYMENT_TARGET is not set, the binary records the runner's
  # own OS version (measured: minos 26.0), so it would only run on the newest
  # macOS. The check below guards against that.
  #
  # macos-14 is marked deprecated, so macos-26 is used here. The result is an
  # arm64-only binary: it cannot run on Intel Macs.
  # ---------------------------------------------------------------------------
  build-macos:
    name: macos-arm64
    runs-on: macos-26          # Apple Silicon; use macos-26-intel for Intel
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          clang++ --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-macos-${{ hashFiles('CMakeLists.txt') }}

      # The system clang links against the OS libc++, so no static C++ runtime
      # flag is needed and the binary depends only on /usr/lib/libc++.1.dylib
      # and /usr/lib/libSystem.B.dylib.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr/local
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          -DBUILD_CLI=ON
          -DBUILD_TEST=OFF
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build

      - name: Install into staging tree
        run: cmake --install build --prefix "$PWD/stage"

      # Make sure the deployment target really took effect and that the binary
      # depends only on system libraries.
      - name: Check runtime dependencies and deployment target
        run: |
          otool -L stage/bin/ctar
          MINOS=$(otool -l stage/bin/ctar | grep -A4 LC_BUILD_VERSION | awk '/minos/{print $2}')
          echo "minimum macOS: $MINOS"
          if [ -z "$MINOS" ]; then
            echo "::error::cannot read LC_BUILD_VERSION; the binary may be unusable"
            exit 1
          fi
          HIGHEST=$(printf '%s\n' 13.3 "$MINOS" | sort -V | tail -1)
          if [ "$HIGHEST" != "13.3" ]; then
            echo "::error::binary requires macOS $MINOS, above the expected 13.3; CMAKE_OSX_DEPLOYMENT_TARGET did not take effect"
            exit 1
          fi
          if otool -L stage/bin/ctar | grep -q '/opt/homebrew'; then
            echo "::error::binary depends on Homebrew dynamic libraries; it must only use system libraries"
            exit 1
          fi
          echo "OK: minimum macOS $MINOS, system libraries only"

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          BASE="ctar-${VERSION}-macos-arm64"

          strip stage/bin/ctar || true
          mkdir -p dist
          cp stage/bin/ctar "dist/${BASE}"
          chmod +x "dist/${BASE}"
          tar -C stage -czf "dist/${BASE}.tar.gz" .

          ls -lh dist

      - name: Smoke test the shipped binary
        run: |
          dist/ctar-*-macos-arm64 --help > /dev/null
          echo "standalone binary runs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    needs: [ build-linux, build-macos ]
    # When triggered manually (not by a tag), only build the artifacts and do
    # not create a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      # gh needs a git repository context even when --repo is given; without a
      # checkout the release step dies with
      #   failed to run git: fatal: not a git repository
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The artifact filenames already contain the tag, so the only meaningful
      # cross-check is between the tag and the version baked into the build.
      # ctar.pc is read instead of parsing `ctar --version`, so the check does
      # not depend on the CLI output format. The path is globbed because
      # CMAKE_INSTALL_LIBDIR is lib64 on RHEL-family systems and lib elsewhere.
      - name: Check tag matches the packaged version
        working-directory: dist
        run: |
          TARBALL=$(ls ctar-*-linux-x86_64.tar.gz)
          PC=$(tar -tzf "$TARBALL" | grep -E '(^|/)ctar\.pc$' | head -1)
          if [ -z "$PC" ]; then
            echo "::error::no ctar.pc inside ${TARBALL}"
            exit 1
          fi
          VERSION=$(tar -xzOf "$TARBALL" "$PC" | sed -n 's/^Version: *//p')
          echo "packaged version: ${VERSION}"
          echo "tag:              ${GITHUB_REF_NAME}"
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the packaged version ${VERSION}"
            exit 1
          fi

      # The only step that executes the final downloaded artifact. The build
      # jobs smoke test their own build tree; this one tests what users get.
      - name: Smoke test the released binary
        working-directory: dist
        run: |
          BIN=$(ls ctar-*-linux-x86_64)
          chmod +x "$BIN"
          ./"$BIN" --version
          ./"$BIN" --help > /dev/null

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum ctar-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write usage notes
        run: |
          cat > NOTES.md <<'EOF'
          ### Standalone executable

          No install needed — download the file **without** the `.tar.gz` suffix,
          then make it executable:

          ```
          chmod +x ctar-<version>-<platform>
          ./ctar-<version>-<platform> --help
          ```

          Platform requirements:

          * `linux-x86_64` — x86_64, glibc 2.28 or newer
            (RHEL 8 / Rocky 8 / Alma 8 and newer, Ubuntu 20.04+, Debian 11+)
          * `macos-arm64` — Apple Silicon, macOS 13.3 or newer

          ### Full package (`.tar.gz`)

          Contains the executable plus headers, static libraries, CMake package
          config and a pkg-config file, for using ctar as a library:

          ```
          sudo tar -xzf ctar-<version>-<platform>.tar.gz -C /usr/local
          sudo ldconfig
          ```

          Verify your download against `SHA256SUMS`.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat NOTES.md)" \
            --generate-notes