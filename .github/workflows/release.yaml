name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # required to create a release

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build inside an Ubuntu 22.04 container so the glibc baseline is 2.35.
  #
  # glibc only works "build old, run new". Building directly on the
  # ubuntu-24.04 runner would require glibc 2.39, which Ubuntu 22.04 (2.35)
  # cannot satisfy. Building inside an ubuntu:22.04 container produces a binary
  # that runs on Ubuntu 22.04 and newer.
  #
  # Why not simply use the ubuntu-22.04 runner: GitHub has announced that image
  # starts deprecation on 2026-09-17 and is removed by 2027-04; the container
  # approach is not affected by that schedule.
  # ---------------------------------------------------------------------------
  build-linux:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      # The jammy repositories do not ship gcc-14 (verified: "Package not
      # available in this suite"), while <print>/std::print in the code
      # requires GCC >= 14, so the toolchain PPA is mandatory.
      # jammy ships cmake 3.22 (>= 3.20, enough for CMAKE_CXX_STANDARD 23)
      # and ninja.
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build software-properties-common
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends gcc-14 g++-14
          echo "--- toolchain ---"
          g++-14 --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-linux-${{ hashFiles('CMakeLists.txt') }}

      # CMAKE_INSTALL_PREFIX is baked into ctar.pc at configure time, so it is
      # fixed at /usr/local to keep the .pc file consistent with where the
      # package is installed.
      # -static-libstdc++ is required, not optional: the container's GCC 14
      # libstdc++ is newer than the one shipped by Ubuntu 22.04, so without
      # static linking the binary fails with GLIBCXX_3.4.3x not found.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr/local
          -DBUILD_CLI=ON
          -DBUILD_TEST=OFF
          -DBUILD_BENCHMARKS=OFF
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build

      - name: Install into staging tree
        run: cmake --install build --prefix "$PWD/stage"

      # Enforce the compatibility promise: if a future change raises the glibc
      # baseline above 2.35, fail the build instead of shipping a binary that
      # cannot run on Ubuntu 22.04.
      - name: Check glibc baseline
        run: |
          BASE=$(objdump -T stage/bin/ctar 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "minimum glibc required: ${BASE:-none (statically linked)}"
          if [ -n "$BASE" ]; then
            HIGHEST=$(printf '%s\n' GLIBC_2.35 "$BASE" | sort -V | tail -1)
            if [ "$HIGHEST" != "GLIBC_2.35" ]; then
              echo "::error::binary requires $BASE, above GLIBC_2.35 of Ubuntu 22.04; it will not run there"
              exit 1
            fi
            echo "OK: not above GLIBC_2.35, runs on Ubuntu 22.04+"
          fi

      - name: Show runtime dependencies
        run: ldd stage/bin/ctar

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          BASE="ctar-${VERSION}-linux-x86_64"

          strip stage/bin/ctar || true
          mkdir -p dist
          cp stage/bin/ctar "dist/${BASE}"
          chmod +x "dist/${BASE}"
          tar -C stage -czf "dist/${BASE}.tar.gz" .

          ls -lh dist

      - name: Smoke test the shipped binary
        run: |
          dist/ctar-*-linux-x86_64 --help > /dev/null
          echo "standalone binary runs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS: use Homebrew GCC 14 rather than the system clang, so that the
  # minimum supported macOS version can be lowered.
  #
  # In Apple's libc++ the floating-point std::to_chars is an OS-exported,
  # availability-annotated symbol
  # (_LIBCPP_AVAILABILITY_TO_CHARS_FLOATING_POINT), and std::format/std::print
  # instantiate the floating-point formatter regardless of the argument types:
  #   std::format("{}:{}", std::string, int)
  # fails with -mmacosx-version-min=11.0 (error: to_chars ... macOS 13.3).
  # So any clang-built binary is pinned to macOS 13.3 or newer.
  #
  # libstdc++ ships its own Ryu-based to_chars
  # (libstdc++-v3/src/c++17/floating_to_chars.cc, namespace ryu) compiled into
  # the library with no OS dependency, so GCC is the only way to go lower.
  # The cost is that libstdc++ has to be linked statically.
  #
  # Also note macos-14 is marked deprecated, so macos-26 is used here.
  # If CMAKE_OSX_DEPLOYMENT_TARGET is not set, the binary records the runner's
  # own OS version (measured: minos 26.0), which would only run on the newest
  # macOS.
  #
  # BUILD_TEST=OFF is required here, not just an optimisation: GCC cannot parse
  # mach/message.h from the macOS 26 SDK (gtest-port.cc includes
  # <mach/mach_init.h>, which pulls it in), so enabling tests would try to build
  # googletest and fail. Unit tests on macOS are covered by the clang in
  # ci.yaml.
  # ---------------------------------------------------------------------------
  build-macos:
    name: macos-arm64
    runs-on: macos-26          # Apple Silicon; use macos-26-intel for Intel
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          g++-14 --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-macos-${{ hashFiles('CMakeLists.txt') }}

      # -static-libstdc++ is likewise required: otherwise the binary depends on
      # Homebrew's /opt/homebrew/opt/gcc/.../libstdc++.6.dylib and will not run
      # for users who do not have GCC installed.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=gcc-14
          -DCMAKE_CXX_COMPILER=g++-14
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr/local
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DBUILD_CLI=ON
          -DBUILD_TEST=OFF
          -DBUILD_BENCHMARKS=OFF
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build

      - name: Install into staging tree
        run: cmake --install build --prefix "$PWD/stage"

      # Confirm the binary does not depend on Homebrew dynamic libraries and
      # print the actual minimum OS version. Trust the printed value for GCC's
      # support of 11.0; if it differs, adjust CMAKE_OSX_DEPLOYMENT_TARGET.
      - name: Check runtime dependencies and deployment target
        run: |
          otool -L stage/bin/ctar
          MINOS=$(otool -l stage/bin/ctar | grep -A4 LC_BUILD_VERSION | awk '/minos/{print $2}')
          echo "minimum macOS: $MINOS"
          if [ -z "$MINOS" ]; then
            echo "::error::cannot read LC_BUILD_VERSION; the binary may be unusable"
            exit 1
          fi
          if [ "$MINOS" != "11.0" ]; then
            echo "::warning::minimum is $MINOS rather than the expected 11.0; adjust CMAKE_OSX_DEPLOYMENT_TARGET accordingly"
          fi
          if otool -L stage/bin/ctar | grep -q '/opt/homebrew'; then
            echo "::error::binary still depends on Homebrew dynamic libraries; static linking did not take effect"
            exit 1
          fi

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          BASE="ctar-${VERSION}-macos-arm64"

          strip stage/bin/ctar || true
          mkdir -p dist
          cp stage/bin/ctar "dist/${BASE}"
          chmod +x "dist/${BASE}"
          tar -C stage -czf "dist/${BASE}.tar.gz" .

          ls -lh dist

      - name: Smoke test the shipped binary
        run: |
          dist/ctar-*-macos-arm64 --help > /dev/null
          echo "standalone binary runs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    needs: [ build-linux, build-macos ]
    # When triggered manually (not by a tag), only build the artifacts and do
    # not create a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum ctar-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write usage notes
        run: |
          cat > NOTES.md <<'EOF'
          ### Standalone executable

          No install needed — download the file **without** the `.tar.gz` suffix,
          then make it executable:

          ```
          chmod +x ctar-<version>-<platform>
          ./ctar-<version>-<platform> --help
          ```

          Platform requirements:

          * `linux-x86_64` — glibc 2.35 or newer (Ubuntu 22.04+)
          * `macos-arm64` — macOS 11 or newer (Apple Silicon)

          ### Full package (`.tar.gz`)

          Contains the executable plus headers, static libraries, CMake package
          config and a pkg-config file, for using ctar as a library:

          ```
          sudo tar -xzf ctar-<version>-<platform>.tar.gz -C /usr/local
          sudo ldconfig
          ```

          Verify your download against `SHA256SUMS`.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat NOTES.md)" \
            --generate-notes