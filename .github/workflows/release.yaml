name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # required to create a release

jobs:
  build-linux:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    container: almalinux:9
    steps:
      - uses: actions/checkout@v4

      # AlmaLinux 9 does not ship GCC 14 as its default toolchain; gcc-toolset-14
      # provides it and installs under /opt/rh, which is NOT on PATH by default.
      # cmake 3.31 (>= 3.20, enough for CMAKE_CXX_STANDARD 23) is in AppStream.
      # ninja-build only lives in the CRB repository, which is disabled by
      # default, so the default Makefiles generator is used instead; make is in
      # BaseOS.
      - name: Install toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git tar gzip binutils cmake make gcc-toolset-14
          echo "--- toolchain ---"
          /opt/rh/gcc-toolset-14/root/usr/bin/g++ --version | head -1
          cmake --version | head -1
          make --version | head -1
          # The gcc-toolset binaries are not on PATH and need their own runtime
          # libraries, so both are exported for the remaining steps.
          echo "/opt/rh/gcc-toolset-14/root/usr/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/rh/gcc-toolset-14/root/usr/lib64:/opt/rh/gcc-toolset-14/root/usr/lib" >> "$GITHUB_ENV"

      - name: Show compiler on PATH
        run: g++ --version | head -1

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-almalinux9-${{ hashFiles('CMakeLists.txt') }}

      # CMAKE_INSTALL_PREFIX is baked into ctar.pc at configure time, so it is
      # fixed at /usr/local to keep the .pc file consistent with where the
      # package is installed.
      # -static-libstdc++ is required, not optional: gcc-toolset-14's libstdc++
      # is newer than the one shipped by AlmaLinux 9, so without static linking
      # the binary fails with GLIBCXX_3.4.3x not found.
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_C_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/gcc
          -DCMAKE_CXX_COMPILER=/opt/rh/gcc-toolset-14/root/usr/bin/g++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr/local
          -DBUILD_CLI=ON
          -DBUILD_TEST=OFF
          -DBUILD_BENCHMARKS=OFF
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build
        run: cmake --build build --parallel "$(nproc)"

      - name: Install into staging tree
        run: cmake --install build --prefix "$PWD/stage"

      # Enforce the compatibility promise: if a future change raises the glibc
      # baseline above 2.34, fail the build instead of shipping a binary that
      # cannot run on RHEL 9.
      - name: Check glibc baseline
        run: |
          BASE=$(objdump -T stage/bin/ctar 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)
          echo "minimum glibc required: ${BASE:-none (statically linked)}"
          if [ -n "$BASE" ]; then
            HIGHEST=$(printf '%s\n' GLIBC_2.34 "$BASE" | sort -V | tail -1)
            if [ "$HIGHEST" != "GLIBC_2.34" ]; then
              echo "::error::binary requires $BASE, above GLIBC_2.34 of RHEL 9; it will not run there"
              exit 1
            fi
            echo "OK: not above GLIBC_2.34, runs on RHEL 9+, Ubuntu 22.04+ and Debian 12+"
          fi

      - name: Show runtime dependencies
        run: ldd stage/bin/ctar

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          BASE="ctar-${VERSION}-linux-x86_64"

          strip stage/bin/ctar || true
          mkdir -p dist
          cp stage/bin/ctar "dist/${BASE}"
          chmod +x "dist/${BASE}"
          tar -C stage -czf "dist/${BASE}.tar.gz" .

          ls -lh dist

      - name: Smoke test the shipped binary
        run: |
          dist/ctar-*-linux-x86_64 --help > /dev/null
          echo "standalone binary runs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: macos-arm64
    runs-on: macos-26          # Apple Silicon; use macos-26-intel for Intel
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          clang++ --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-macos-${{ hashFiles('CMakeLists.txt') }}

      # The system clang links against the OS libc++, so no static C++ runtime
      # flag is needed and the binary depends only on /usr/lib/libc++.1.dylib
      # and /usr/lib/libSystem.B.dylib.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=/usr/local
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          -DBUILD_CLI=ON
          -DBUILD_TEST=OFF
          -DBUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build build

      - name: Install into staging tree
        run: cmake --install build --prefix "$PWD/stage"

      # Make sure the deployment target really took effect and that the binary
      # depends only on system libraries.
      - name: Check runtime dependencies and deployment target
        run: |
          otool -L stage/bin/ctar
          MINOS=$(otool -l stage/bin/ctar | grep -A4 LC_BUILD_VERSION | awk '/minos/{print $2}')
          echo "minimum macOS: $MINOS"
          if [ -z "$MINOS" ]; then
            echo "::error::cannot read LC_BUILD_VERSION; the binary may be unusable"
            exit 1
          fi
          HIGHEST=$(printf '%s\n' 13.3 "$MINOS" | sort -V | tail -1)
          if [ "$HIGHEST" != "13.3" ]; then
            echo "::error::binary requires macOS $MINOS, above the expected 13.3; CMAKE_OSX_DEPLOYMENT_TARGET did not take effect"
            exit 1
          fi
          if otool -L stage/bin/ctar | grep -q '/opt/homebrew'; then
            echo "::error::binary depends on Homebrew dynamic libraries; it must only use system libraries"
            exit 1
          fi
          echo "OK: minimum macOS $MINOS, system libraries only"

      - name: Stage release assets
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git rev-parse --short HEAD)}"
          BASE="ctar-${VERSION}-macos-arm64"

          strip stage/bin/ctar || true
          mkdir -p dist
          cp stage/bin/ctar "dist/${BASE}"
          chmod +x "dist/${BASE}"
          tar -C stage -czf "dist/${BASE}.tar.gz" .

          ls -lh dist

      - name: Smoke test the shipped binary
        run: |
          dist/ctar-*-macos-arm64 --help > /dev/null
          echo "standalone binary runs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  release:
    needs: [ build-linux, build-macos ]
    # When triggered manually (not by a tag), only build the artifacts and do
    # not create a release.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum ctar-* > SHA256SUMS
          cat SHA256SUMS

      - name: Write usage notes
        run: |
          cat > NOTES.md <<'EOF'
          ### Standalone executable

          No install needed — download the file **without** the `.tar.gz` suffix,
          then make it executable:

          ```
          chmod +x ctar-<version>-<platform>
          ./ctar-<version>-<platform> --help
          ```

          Platform requirements:

          * `linux-x86_64` — x86_64, glibc 2.34 or newer
            (RHEL 9 / Rocky 9 / Alma 9, Ubuntu 22.04+, Debian 12+)
          * `macos-arm64` — Apple Silicon, macOS 13.3 or newer

          ### Full package (`.tar.gz`)

          Contains the executable plus headers, static libraries, CMake package
          config and a pkg-config file, for using ctar as a library:

          ```
          sudo tar -xzf ctar-<version>-<platform>.tar.gz -C /usr/local
          sudo ldconfig
          ```

          Verify your download against `SHA256SUMS`.
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "$(cat NOTES.md)" \
            --generate-notes