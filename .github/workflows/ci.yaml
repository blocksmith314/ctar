name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC 14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            extra: ''
          - name: Linux / Clang 19
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            extra: ''
          - name: macOS / arm64 (clang)
            os: macos-26
            cc: clang
            cxx: clang++
            extra: '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.3'

    steps:
      - uses: actions/checkout@v4

      # clang-19 on Linux uses libstdc++ by default, so gcc-14 has to be present
      # for clang to pick up a libstdc++ 14 that has <print>, rather than the
      # distribution's default 13.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 clang-19 libstdc++-14-dev

      # On macOS, clang / cmake / ninja are preinstalled on the runner image.
      - name: Show toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.cxx }} --version | head -1
          cmake --version | head -1
          ninja --version

      # CMakeLists points FetchContent's SOURCE_DIR inside the source tree at
      # third_party/, not build/_deps. On a cache hit, lz4 and googletest are
      # never fetched over the network.
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ matrix.os }}-${{ matrix.cc }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=ON
          -DBUILD_BENCHMARKS=OFF
          ${{ matrix.extra }}

      - name: Build
        run: cmake --build build

      # Report the platform baseline of the produced binary: the glibc symbol
      # version on Linux, the LC_BUILD_VERSION minimum on macOS.
      - name: Report platform baseline (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "minimum glibc: $(objdump -T build/ctar | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          ldd build/ctar

      - name: Check platform baseline (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L build/ctar
          MINOS=$(otool -l build/ctar | grep -A4 LC_BUILD_VERSION | awk '/minos/{print $2}')
          echo "minimum macOS: $MINOS"
          if [ -z "$MINOS" ]; then
            echo "::error::cannot read LC_BUILD_VERSION; the binary may be unusable"
            exit 1
          fi
          HIGHEST=$(printf '%s\n' 13.3 "$MINOS" | sort -V | tail -1)
          if [ "$HIGHEST" != "13.3" ]; then
            echo "::error::binary requires macOS $MINOS, above the expected 13.3; CMAKE_OSX_DEPLOYMENT_TARGET did not take effect"
            exit 1
          fi
          if otool -L build/ctar | grep -q '/opt/homebrew'; then
            echo "::error::binary depends on Homebrew dynamic libraries; it must only use system libraries"
            exit 1
          fi
          echo "OK: minimum macOS $MINOS, system libraries only"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Dump ctest log on failure
        if: failure()
        working-directory: build
        run: cat Testing/Temporary/LastTest.log