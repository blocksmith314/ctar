name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #
  # 1) macOS + clang  -> runs the unit tests. clang/libc++ can parse the
  #    macOS 26 SDK headers, so googletest builds.
  # 2) macOS + GCC 14 -> validates the release recipe only, without googletest.
  #    GCC cannot parse mach/message.h from the macOS 26 SDK (gtest-port.cc
  #    includes <mach/mach_init.h>, which pulls it in), producing 21 errors of
  #    the form "expected constructor, destructor, or type conversion before
  #    '(' token". The project's own sources do compile with GCC; only
  #    googletest is affected.
  #
  # Why the release build uses GCC instead of clang: in Apple's libc++ the
  # floating-point std::to_chars is an OS-exported, availability-annotated
  # symbol (_LIBCPP_AVAILABILITY_TO_CHARS_FLOATING_POINT). Because
  # std::format/std::print instantiate the floating-point formatter regardless
  # of the argument types, even
  #   std::format("{}:{}", std::string, int)
  # fails to compile with -mmacosx-version-min=11.0. That pins any clang-built
  # binary to macOS 13.3+. libstdc++ ships its own Ryu-based to_chars that does
  # not depend on the OS, so only GCC can lower the floor to 11.0.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC 14
            os: ubuntu-24.04
            cc: gcc-14
            cxx: g++-14
            test: 'ON'
            extra: ''
          - name: Linux / Clang 19
            os: ubuntu-24.04
            cc: clang-19
            cxx: clang++-19
            test: 'ON'
            extra: ''
          - name: macOS / arm64 (clang, tests)
            os: macos-26
            cc: clang
            cxx: clang++
            test: 'ON'
            extra: ''
          - name: macOS / arm64 (GCC 14, release recipe)
            os: macos-26
            cc: gcc-14
            cxx: g++-14
            test: 'OFF'
            extra: '-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"'

    steps:
      - uses: actions/checkout@v4

      # The code uses <print>/std::print, which requires GCC >= 14 or
      # libc++ >= 18. On Linux, clang-19 uses libstdc++ by default, so gcc-14
      # must be installed for clang to see a libstdc++ 14 that has <print>
      # rather than the distribution's default 13.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 clang-19 libstdc++-14-dev

      # On macOS, clang / gcc-14 / cmake / ninja are all preinstalled on the
      # runner image, so nothing needs to be installed.
      - name: Show toolchain (macOS)
        if: runner.os == 'macOS'
        run: |
          ${{ matrix.cxx }} --version | head -1
          cmake --version | head -1
          ninja --version

      # CMakeLists points FetchContent's SOURCE_DIR inside the source tree at
      # third_party/, not build/_deps. On a cache hit, lz4 and googletest are
      # never fetched over the network.
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ matrix.os }}-${{ matrix.cc }}-${{ matrix.test }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TEST=${{ matrix.test }}
          -DBUILD_BENCHMARKS=OFF
          ${{ matrix.extra }}

      - name: Build
        run: cmake --build build

      # Report the platform baseline of the produced binary: the glibc symbol
      # version on Linux, the LC_BUILD_VERSION minimum on macOS.
      - name: Report platform baseline (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "minimum glibc: $(objdump -T build/ctar | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          ldd build/ctar

      - name: Report platform baseline (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -l build/ctar | grep -A4 LC_BUILD_VERSION | awk '/minos/{print "minimum macOS:", $2}'
          otool -L build/ctar

      - name: Test
        if: matrix.test == 'ON'
        working-directory: build
        run: ctest --output-on-failure

      - name: Dump ctest log on failure
        if: failure() && matrix.test == 'ON'
        working-directory: build
        run: cat Testing/Temporary/LastTest.log